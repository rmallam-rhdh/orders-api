# ==============================================================================
# Thin Application Values (Consumes IDP Platform Base Chart: idp-service-chart)
# All Kubernetes, OpenShift Route, and Ambient Service Mesh templates live in
# the IDP-managed `idp-service-chart` dependency — zero template duplication!
# ==============================================================================
idp-service-chart:
  name: orders-api
  appId: "APP-1042"
  ownerGroup: "group:default/developers"
  namespace: demo-dev

  replicaCount: 1

  image:
    repository: registry.access.redhat.com/ubi9/openjdk-21-runtime
    tag: latest
    pullPolicy: IfNotPresent

  # Immediate executable bootstrap HTTP server for /health and /api so the
  # deployment is Ready in demo-dev immediately after Golden Path creation,
  # before a custom app image is built and pushed from Containerfile.
  command:
    - /bin/bash
    - -c
    - |
      mkdir -p /tmp/web/api
      printf '{"status":"ok","app":"orders-api","appId":"APP-1042"}\n' > /tmp/web/health
      printf '{"service":"orders-api","system":"mallamsbank","appId":"APP-1042","message":"ok"}\n' > /tmp/web/api/index.html
      printf '<!doctype html><html><body style="font-family:sans-serif;margin:2rem"><h1>orders-api (APP-1042)</h1><p>Enterprise Quarkus 3 / Java 21 microservice with Ambient Mesh, OpenAPI, and Command Centre telemetry</p><p>Deployed via IDP Shared Base Chart (idp-service-chart:1.0.0) + Argo CD</p></body></html>\n' > /tmp/web/index.html
      exec jwebserver -b 0.0.0.0 -p 8080 -d /tmp/web

  service:
    port: 8080
    healthCheckPath: /health

  clusterBaseDomain: apps.rosa.rosa-rwx5g.f8y9.p3.openshiftapps.com

  mesh:
    enabled: true
    dataplane: ambient
    denyAll: true
    waypoint:
      enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
