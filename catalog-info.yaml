      url: https://github.com/rmallam-rhdh/orders-api/tree/main/chart
      icon: github
      type: gitops
    - title: Jenkinsfile CI/CD Pipeline (Test -> Sonar -> Helm)
      url: https://github.com/rmallam-rhdh/orders-api/blob/main/Jenkinsfile
      icon: github
      type: cicd
    - title: JFrog Artifactory — Container Repository
      url: http://saas-stubs.saas-stubs.svc:8080/ui/repos/tree/General/docker-local/orders-api
      icon: box
      type: artifact-repository
    - title: "Vault Enterprise UI — Non-Prod (payments/nonprod)"
      url: https://vault-ui.corp.example.com/ui/vault/secrets/kv/kv/list/ledger-service?namespace=payments%2Fnonprod
