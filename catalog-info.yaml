    - title: "Start Day-2 Feature Branch & Dev Spaces Workspace (RHDH Template)"
      url: https://backstage-developer-hub-rhdh.apps.rosa.rosa-rwx5g.f8y9.p3.openshiftapps.com/create/templates/default/acme-start-feature-devspaces
      icon: scaffolder
